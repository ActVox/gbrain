name: Upstream Watcher

on:
  schedule:
    # Keep upstream deltas small without auto-deploying anything.
    - cron: '17 */6 * * *'
  workflow_dispatch:

# The job pushes and opens PRs with a GitHub App installation token, not
# GITHUB_TOKEN: GITHUB_TOKEN cannot push commits that touch .github/workflows/
# (every upstream release does), and PRs it opens do not trigger CI.
permissions:
  contents: read

concurrency:
  group: upstream-watcher
  cancel-in-progress: false

jobs:
  upstream-watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require the watcher App credential
        env:
          CLIENT_ID: ${{ vars.ACTVOX_UPSTREAM_APP_CLIENT_ID }}
          HAS_KEY: ${{ secrets.ACTVOX_UPSTREAM_APP_PRIVATE_KEY != '' }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ "$HAS_KEY" != "true" ]; then
            echo "::error title=Upstream watcher credential missing::Set repo variable ACTVOX_UPSTREAM_APP_CLIENT_ID and secret ACTVOX_UPSTREAM_APP_PRIVATE_KEY (docs/operations/fork-upstream-production-branching.md)."
            exit 1
          fi

      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ vars.ACTVOX_UPSTREAM_APP_CLIENT_ID }}
          private-key: ${{ secrets.ACTVOX_UPSTREAM_APP_PRIVATE_KEY }}
          repositories: gbrain
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
        with:
          bun-version: 1.4.2

      - name: Configure remotes
        run: |
          git remote set-url origin https://github.com/ActVox/gbrain.git
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/garrytan/gbrain.git
          else
            git remote add upstream https://github.com/garrytan/gbrain.git
          fi

      - name: Git identity
        run: |
          git config user.name "actvox-upstream-watcher[bot]"
          git config user.email "actvox-upstream-watcher[bot]@users.noreply.github.com"

      - name: Create or update upstream PR
        id: upstream
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BASE_BRANCH: master
          UPSTREAM_REMOTE: upstream
          UPSTREAM_BRANCH: master
          ORIGIN_REMOTE: origin
          PR_BRANCH: automation/upstream-master
          PR_TITLE: "chore: sync upstream gbrain master"
        # Policy conflicts resolve by scripts/actvox/merge-policy.tsv; anything
        # else fails this run (exit 10) and updates one conflict issue.
        run: bash scripts/create-upstream-pr.sh

      - name: Upload conflict report if merge failed
        if: always() && steps.upstream.outputs.merge_conflict == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gbrain-upstream-conflict-report
          path: /tmp/gbrain-upstream-conflict.md
          if-no-files-found: ignore
