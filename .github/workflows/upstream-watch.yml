name: Upstream Watcher

on:
  schedule:
    # Keep upstream deltas small without auto-deploying anything.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-watcher
  cancel-in-progress: false

jobs:
  upstream-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure remotes
        run: |
          git remote set-url origin https://github.com/ActVox/gbrain.git
          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/garrytan/gbrain.git
          else
            git remote add upstream https://github.com/garrytan/gbrain.git
          fi

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create or update upstream PR
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: master
          UPSTREAM_REMOTE: upstream
          UPSTREAM_BRANCH: master
          ORIGIN_REMOTE: origin
          PR_BRANCH: automation/upstream-master
          PR_TITLE: "chore: sync upstream gbrain master"
          # Scheduled detection reports a known semantic conflict as a warning.
          # Manual dispatch preserves the non-zero conflict exit for investigation.
          CONFLICT_IS_WARNING: ${{ github.event_name == 'schedule' && '1' || '0' }}
        run: bash scripts/create-upstream-pr.sh

      - name: Upload conflict report if merge failed
        if: always() && steps.upstream.outputs.merge_conflict == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: gbrain-upstream-conflict-report
          path: /tmp/gbrain-upstream-conflict.md
          if-no-files-found: ignore
