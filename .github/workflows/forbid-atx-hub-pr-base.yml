name: Forbid ATX-HUB PR Base

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Forbid ATX-HUB as PR base
        run: |
          if [ "${{ github.base_ref }}" = "ATX-HUB" ]; then
            echo "ATX-HUB is rollback-only. Open upstream-integration PRs against master."
            exit 1
          fi
          echo "PR base is allowed: ${{ github.base_ref }}"
