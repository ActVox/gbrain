name: Semgrep

# Static analysis (SAST) with Semgrep Community Edition (#2272). Tokenless:
# uses the public registry rulesets, needs zero secrets. Findings print in
# the job log; no code-scanning/SARIF upload by design (keeps permissions
# read-only, no security-events: write).

on:
  pull_request:
    branches: [master]
  schedule:
    - cron: '30 7 * * 1'  # weekly, Monday 07:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.170.0@sha256:c98f8829eea377274ee4b10656458b078b88232469b2ff913f091c2317347c9d
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Full history so --baseline-commit can diff against the PR base;
          # a shallow clone would not contain the base commit.
          fetch-depth: 0
      - name: Trust checkout for containerized git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      # Graduated from advisory: ordinary PRs fail only on findings new since
      # their merge base. Exact-tag upstream integrations are different: the
      # upstream release is scanned report-only, while the ActVox overlay is
      # blocking. This keeps registry false positives in adopted upstream code
      # visible without turning every release train into a false-red PR.
      - name: Semgrep scan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            bash scripts/test-select-semgrep-baseline.sh
            MERGE_BASE="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            BASELINE="$(bash scripts/select-semgrep-baseline.sh "$BASE_SHA" "$HEAD_SHA")"
            test -n "$BASELINE"
            if [ "$BASELINE" != "$MERGE_BASE" ]; then
              echo "Exact-tag upstream integration — full-tree report-only audit"
              semgrep scan --config p/default --config p/typescript || true
            fi
            echo "PR scan — blocking only on fork-overlay findings new since $BASELINE"
            semgrep scan --config p/default --config p/typescript --error --baseline-commit "$BASELINE"
          else
            echo "Full-tree scan (schedule/dispatch) — report-only"
            semgrep scan --config p/default --config p/typescript || true
          fi
